onboarding:
  seen:
    openclaw_residue_cleanup: true
plugins:
  enabled:
    - herdr-agent-state
providers:
  astra:
    name: Astra Proxy
    base_url: http://127.0.0.1:6447/v1
    key_cmd: /usr/bin/cat -- /home/erikfrish/.local/share/astra-proxy/client-api-key
    api_mode: chat_completions
    default_model: glm-5.3
    models:
      gemini-4-argon: {}
      gemini-3.8-flash: {}
      kimi-k3: {}
      glm-5.3: {}
      glm-5.3-flash: {}
      kimi-k2.7-code: {}
      deepseek-v4-flash: {}
      deepseek-v4-pro: {}
  astra-openai:
    name: Astra Proxy Responses
    base_url: http://127.0.0.1:6447/v1
    key_cmd: /usr/bin/cat -- /home/erikfrish/.local/share/astra-proxy/client-api-key
    api_mode: codex_responses
    default_model: gpt-6.1-sol
    models:
      gpt-6-astra: {}
      gpt-6.1-sol: {}
      gpt-6-luna: {}
      grok-4.7: {}
  astra-anthropic:
    name: Astra Proxy Messages
    base_url: http://127.0.0.1:6447
    key_cmd: /usr/bin/cat -- /home/erikfrish/.local/share/astra-proxy/client-api-key
    api_mode: anthropic_messages
    default_model: claude-sonnet-5
    models:
      claude-fable-5-1: {}
      claude-opus-5-5: {}
      claude-opus-4-6: {}
      claude-sonnet-5: {}
      claude-haiku-5-5: {}
