# ============================================================
# tmux.conf — modern, self-contained config (tmux >= 3.2)
# Install: ~/.config/tmux/tmux.conf
#
# Colors are taken from the TERMINAL palette (ANSI 0-15), not
# hardcoded, so the status bar follows the active theme
# automatically: theme-switch rewrites alacritty theme.toml and
# tmux resolves colour0-15 through the terminal's palette.
#
# Mapping (from ~/.config/alacritty/theme.toml, generated by
# theme-switch's apply_alacritty):
#   colour0 = theme bg        colour4 = accent (blue)
#   colour1 = critical (red)  colour5 = accent_alt (mauve)
#   colour2 = ok (green)      colour7 = theme fg
#   colour3 = warm (yellow)   colour8 = muted
#   colour15 = white
# ============================================================

# ------------------------------------------------------------
# General behaviour
# ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1              # sessions/windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on       # keep window numbers tight
set -g detach-on-destroy on
set -g history-limit 30000
set -g escape-time 10            # snappier vim/esc
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g display-panes-time 1000
set -g display-time 1500
set -g status-interval 2
set -g status-justify left
set -g repeat-time 500           # allow held-repeat on -r binds
set -g allow-passthrough on
setw -g mode-keys vi
set -g message-style "bg=colour0,fg=colour7"
set -g message-command-style "bg=colour0,fg=colour7"
set -g pane-border-status off

# ------------------------------------------------------------
# Status bar — colors resolved through the terminal palette
# ------------------------------------------------------------
set -g status "on"
set -g status-style "bg=colour0,fg=colour8"
set -g status-left-length 30
set -g status-right-length 100

# left: session name (accent pill)
set -g status-left \
  "#[bg=colour4,fg=colour0,bold]  ♥ #{?client_prefix,#[reverse],} #S #[bg=colour0,fg=colour4] "

# window list: active gets accent pill, inactive dim text
setw -g window-status-format \
  "#[bg=colour0,fg=colour8]  #I #W  "
setw -g window-status-current-format \
  "#[bg=colour4,fg=colour0,bold]  #I #W  #[bg=colour0,fg=colour4]"
setw -g window-status-separator " "

# right: date -> time (accent_alt pill)
set -g status-right \
  "#[bg=colour0,fg=colour8] %a %d %b #[bg=colour5,fg=colour0,bold] %H:%M #[bg=colour0,fg=colour5]  "

# prefix feedback
set -g status-left-style "bg=colour0,fg=colour4"
set -g status-right-style "bg=colour0,fg=colour5"

# ------------------------------------------------------------
# Splits & navigation
# ------------------------------------------------------------
# new splits open in the pane's current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ALT + hjkl / arrows: quick pane navigation (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# prefix + hjkl: same, for terminals that swallow ALT
bind -r H select-pane -L
bind -r J select-pane -D
bind -r K select-pane -U
bind -r L select-pane -R

# resizing: hold prefix, tap hjkl
bind -r M-H resize-pane -L 5
bind -r M-J resize-pane -D 5
bind -r M-K resize-pane -U 5
bind -r M-L resize-pane -R 5

# ------------------------------------------------------------
# Windows & sessions
# ------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind 0 select-window -t :=0
bind C-a last-window
bind a last-window
bind & confirm-before -p "kill window #W? (y/N)" kill-window
bind x confirm-before -p "kill pane #P? (y/N)" kill-pane

# choose-tree in a floating popup
bind C-s display-popup -w 70% -h 80% -E "tmux choose-tree -Zs"
# scratchpad: reusable throwaway session in a popup
bind C-p display-popup -w 80% -h 80% -E "tmux new-session -A -s scratch"

# fzf-powered session switcher
bind C-f display-popup -w 70% -h 40% -E "tmux switch-client -t \$(tmux list-sessions -F '#S' | fzf)"

# ------------------------------------------------------------
# Copy mode (vi)
# ------------------------------------------------------------
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Wayland clipboard via wl-copy/wl-paste
if-shell 'command -v wl-copy' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"; bind C-y run -b "tmux show-buffer | wl-copy"'
if-shell 'command -v wl-paste' \
  'bind C-v run -b "wl-paste | tmux load-buffer - && tmux paste-buffer"'

# ------------------------------------------------------------
# Misc quality of life
# ------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded ✔"
bind M-k kill-server
bind m set-option -g mouse \; display "mouse #{?mouse,on,off}"
