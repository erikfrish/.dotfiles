# ┃                    Enviroment Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

envd = HYPRCURSOR_SIZE,24
envd = XCURSOR_SIZE,24
envd = QT_CURSOR_SIZE,24

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = SSH_AUTH_SOCK,/run/user/1000/ssh-agent.socket
env = SDL_VIDEODRIVER,wayland,x11 # Важно для игр и самого Steam

# Dark theme hints for GTK and Qt apps.
env = GTK_THEME,adw-gtk3-dark
env = QT_STYLE_OVERRIDE,Adwaita-Dark

env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia 
env = WLR_NO_HARDWARE_CURSORS,1
env = EGL_PLATFORM,wayland

# env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:01:00.0-card
