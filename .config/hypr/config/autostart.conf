# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

source = ~/.config/hypr/config/defaults.conf

exec-once = waybar &
exec-once = hyprpaper &
# Audio: use EasyEffects convolver for the internal speakers, with Speaker as fallback.
exec-once = sh -c 'easyeffects --service-mode --hide-window & sleep 2; easyeffects --load-preset thinkpad-speakers >/dev/null 2>&1 || true; pactl set-default-sink easyeffects_sink 2>/dev/null || pactl set-default-sink alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink'
# Managed by gammastep.service so Waybar can start/stop the same unit.
exec-once = systemctl --user start gammastep.service
# exec-once = $scriptsDir/startup

exec-once = fcitx5 -d &
# exec-once = mako &
exec-once = # В hyprland.conf
# Managed by swaync.service to avoid duplicate notification daemons.
exec-once = systemctl --user start swaync.service
exec-once = nm-applet --indicator & # network manager
exec-once = blueman-applet & # bluetooth tray applet

# OSD
exec-once = bash -c "rm -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob -c ~/.config/wob/wob.ini" # volume and brightness OSD
exec-once = swayosd-server & $scriptsDir/lang_switch_osd & # alternative OSD for volume and brightness

exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

## Idle configuration
# exec-once = swayidle -w timeout 300 'swaylock -f -c 000000' before-sleep 'swaylock -f -c 000000'
exec-once = hypridle &

# Managed by arch-update-tray.service to avoid duplicate tray applets.
exec-once = systemctl --user start arch-update-tray.service

## clipboard manager 
exec-once = wl-clip-persist --clipboard regular
# cliphist
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-paste --watch cliphist store
# # exec-once = cliphist wipe; wl-paste --watch cliphist store
## exec-once = wl-paste --watch clipvault store
## exec-once = wl-paste --type text --watch clipvault store
## exec-once = wl-paste --type image --watch clipvault store
## exec-once = wl-paste --watch clipvault store --min-entry-length 2 --max-entries 200 --max-entry-age 2d


# autostart applications
exec-once = [workspace 2 silent] $browser
exec-once = [workspace 3 silent] $IDE
# exec-once = [workspace 4 silent] $workMessenger
exec-once = [workspace 6 silent] $telegram
exec-once = $scriptsDir/launch_band
exec-once = hyprctl dispatch workspace 1

exec-once = $scriptsDir/change_wallpaper
