# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki: https://wiki.hypr.land/Configuring/Monitors/

# Hardware-agnostic default: enable every connected monitor at its preferred
# mode, place it automatically, and let Hyprland choose a sane scale.
monitor = , preferred, auto, auto

# Host-specific examples. Keep them commented in shared dotfiles; uncomment only
# locally if a machine needs pinning.
# monitor = eDP-1, 3072x1920@120, auto, 2
# monitor = Virtual-1, 1920x1080@60, 0x0, 1.5

# Fake HDMI capture/virtual output exposed on compik. Disable it while keeping
# real monitors on automatic preferred mode.
monitor = HDMI-A-2, disable

# If you need to scale things like steam etc, please uncomment these lines.
# Adjust GDK_SCALE accordingly to your liking.
xwayland {
 force_zero_scaling = true       # Unscale XWayland
}

#env = GDK_SCALE, 1.25                   # GDK Scaling Factor

# Run to get your monitors list:
# hyprctl monitors
