# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #
# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = audio-control
    match:class = org.pulseaudio.pavucontrol
    float = on
    # on the top right corner under the status bar
    move = monitor_w-820 100
    size = 800 700
}

windowrule {
    name = overskride # bluetooth device manager
    match:title = overskride
    float = on
    # move = monitor_w-20 monitor_h-12
    # on the top right corner under the status bar
    move = monitor_w-820 100
    size = 800 700
}
windowrule {
    name = bluetooth
    match:class = blueman-manager
    float = on
    # on the top right corner under the status bar
    move = monitor_w-820 100
    size = 800 700
}
windowrule {
    name = network-manager
    match:class = nm-connection-editor
    float = on
    # on the top right corner under the status bar
    move = monitor_w-820 100
    size = 800 700
}
windowrule {
    name = iwgtk
    match:title = iwgtk
    float = on
    # on the top right corner under the status bar
    move = monitor_w-820 100
    size = 800 700
}


windowrule {
    name = PiP
    match:title = ^(.*[Pp][Ii][Pp].*|[Pp]icture.?in.?[Pp]icture.*)$
    float = on
    # size = 800 700
    move = monitor_w-720 monitor_h-400
    size = 584 328 # 960 540
    keep_aspect_ratio = on
    pin = on
}

windowrule {
    name = Previewer
    match:class = org.gnome.[N,n]autilus*[P,p]reviewer* 
    float = on
    pseudo = on
}

windowrule {
    name = File Dialogs
    match:title = ^(Save File|Open File)$
    float = on
    size = 600 400
}

windowrule {
    name = menu
    match:class = wofi
    float = on
    stay_focused = on
}

windowrule = match:class Band, no_focus = on


