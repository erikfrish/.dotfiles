# ALSA configuration for ThinkPad T14p Gen 3
# Arrow Lake cAVS + Realtek ALC257 speaker optimization

defaults.pcm.card 0
defaults.pcm.device 0
defaults.ctl.card 0

# Route through hardware directly for minimal latency
pcm.!default {
    type asym
    playback.pcm "speaker_out"
    capture.pcm "default"
}

# Speaker output with hardware mixing
pcm.speaker_out {
    type plug
    slave.pcm "hw:0,0"
}

# Control mapping
ctl.!default {
    type hw
    card 0
}
